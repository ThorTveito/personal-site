# Henter nye bilder fra Google Drive-mappa, gjør dem klare for nettet, og publiserer siden.
# Kjøres for hånd: Actions → «Hent nye bilder» → Run workflow.
#
# Engangsoppsett (Settings → Secrets and variables → Actions → New repository secret):
#   GOOGLE_API_KEY   API-nøkkel fra Google Cloud med Drive API slått på
#   DRIVE_FOLDER_ID  ID-en til Drive-mappa (delt som «alle med lenken kan se»)
name: Hent nye bilder

on:
  workflow_dispatch:

concurrency:
  group: photos
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer ImageMagick med HEIC-støtte
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick >/dev/null
          # HEIC-dekoderen heter forskjellig mellom Ubuntu-versjoner. Prøv, men ikke stopp hvis den mangler.
          sudo apt-get install -y -qq libheif1 libheif-plugin-libde265 >/dev/null 2>&1 || sudo apt-get install -y -qq libheif1 >/dev/null 2>&1 || true
          (convert -list format || magick -list format) | grep -i heic || echo "Advarsel: ImageMagick mangler HEIC-støtte"

      - name: Hent, konverter og lag photos.json
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: node scripts/sync-drive.mjs

      - name: Lagre nye bilder i repoet
        id: commit
        run: |
          git add -A site
          if git diff --cached --quiet; then
            echo "Ingen nye bilder."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          n=$(git diff --cached --name-only --diff-filter=A -- site/photos | wc -l)
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Nye bilder fra Drive ($n)"
          git pull -q --rebase origin "${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "La til $n bilder." >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: photos
    if: needs.photos.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ github.ref_name }}
