# Publiserer mappa site/ til GitHub Pages ved hver push til main
# (også når skrivesiden lagrer en ny beretning).
# Engangsoppsett i GitHub: Settings → Pages → Source: «GitHub Actions».
name: Publiser nettsiden

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Kalles av andre arbeidsflyter (photos.yml). Commits laget med GITHUB_TOKEN
  # starter nemlig ikke «push»-arbeidsflyter av seg selv.
  workflow_call:
    inputs:
      ref:
        description: Gren eller commit som skal publiseres
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
