<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bilder · Thor Tveito</title>
<meta name="theme-color" content="#f2efe9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cstyle%3Epath%7Bstroke:%230d0d0d%7D@media(prefers-color-scheme:dark)%7Bpath%7Bstroke:%23f2efe9%7D%7D%3C/style%3E%3Cpath d='M3 11V3h8M21 3h8v8M29 21v8h-8M11 29H3v-8' fill='none' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23a84a26'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="gallery.css">
</head>
<body class="gallery-page">
<header data-site-header></header>

<main id="stage" aria-label="Bilderom">
  <h1 class="visually-hidden">Bilder</h1>
  <div id="scene"></div>
</main>

<div id="loader" role="status" aria-live="polite">
  <span class="vf"><span class="vf-text" id="loader-name">Thor Tveito</span></span>
  <div class="loader-bar"><div id="loader-fill"></div></div>
  <div id="loader-text" class="label">Laster bilder …</div>
</div>

<div id="caption" aria-live="polite"></div>

<div class="room-controls">
  <div class="zoom">
    <button type="button" class="icon-btn" id="zoom-in" aria-label="Zoom inn">+</button>
    <button type="button" class="icon-btn" id="zoom-out" aria-label="Zoom ut">−</button>
  </div>
  <p class="hint label">Dra for å flytte deg. Scroll eller +/− for å zoome.</p>
</div>

<dialog id="viewer" aria-label="Bildevisning">
  <button type="button" class="icon-btn close" aria-label="Lukk">×</button>
  <button type="button" class="icon-btn nav-btn prev" aria-label="Forrige bilde">←</button>
  <figure>
    <img id="viewer-img" alt="">
    <figcaption id="viewer-cap"></figcaption>
  </figure>
  <button type="button" class="icon-btn nav-btn next" aria-label="Neste bilde">→</button>
</dialog>

<script src="site.js"></script>
<script src="gallery.js"></script>
</body>
</html>
