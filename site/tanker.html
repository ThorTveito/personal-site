<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanker</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="text-page">
<header class="hud">
  <div id="site-name" class="name"></div>
  <nav aria-label="Seksjoner">
    <a href="index.html">Bilder</a>
    <a href="tanker.html" aria-current="page">Tanker</a>
  </nav>
</header>
<main class="posts">
  <h1>Tanker</h1>
  <div id="posts"><p class="empty">Laster …</p></div>
  <p><a id="doc-link" href="#" hidden>Åpne hele dokumentet i Google Docs →</a></p>
</main>
<script>
(async () => {
  const box = document.getElementById('posts');
  try {
    const d = await (await fetch('tanker.json', { cache: 'no-cache' })).json();
    document.getElementById('site-name').textContent = d.name || '';
    if (d.docUrl) { const a = document.getElementById('doc-link'); a.href = d.docUrl; a.hidden = false; }
    box.textContent = '';
    if (!d.posts.length) { box.innerHTML = '<p class="empty">Ingen tanker ennå.</p>'; return; }
    for (const p of d.posts) {
      const art = document.createElement('article'); art.className = 'post';
      if (p.date) { const t = document.createElement('time'); t.textContent = p.date; art.appendChild(t); }
      const h = document.createElement('h2'); h.textContent = p.title; art.appendChild(h);
      const b = document.createElement('p'); b.textContent = p.body; art.appendChild(b);
      box.appendChild(art);
    }
  } catch (e) {
    box.innerHTML = '<p class="empty">Fant ikke tanker.json. Kjør: node scripts/sync-tanker.mjs</p>';
  }
})();
</script>
</body>
</html>
